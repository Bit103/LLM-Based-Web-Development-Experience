<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }

    .intro-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet, red);
      background-size: 800% 800%;
      animation: rainbowBg 10s ease infinite;
      color: white;
      animation: fadeIn 1s ease-in-out, rainbowBg 10s ease infinite;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rainbowBg {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .intro-page h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .intro-page p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #bdc3c7;
      max-width: 500px;
      line-height: 1.6;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    .intro-page a {
      padding: 12px 30px;
      background-color: #e74c3c;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1.1rem;
      transition: background-color 0.3s, transform 0.3s;
      display: inline-block;
    }

    .intro-page a:hover {
      background-color: #c0392b;
      transform: scale(1.05);
    }

    .dynamic-text {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #bdc3c7;
      max-width: 500px;
      line-height: 1.6;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
      min-height: 1.6em;
    }

    .dynamic-text span {
      border-right: 2px solid #bdc3c7;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    @media (max-width: 600px) {
      .intro-page h1 {
        font-size: 2rem;
      }

      .dynamic-text {
        font-size: 1rem;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>

  <div class="intro-page">
    <h1 id="mainHeading">Welcome to My Website</h1>
    <p id="dynamicText"></p>
    <a href="#">Get Started</a>
  </div>

  <script>
    const messages = [
      "This is a personal website showcasing my work and interests.",
      "I love creating beautiful things on the web.",
      "Here you'll find my latest projects and ideas.",
      "Welcome to my little corner of the internet!"
    ];

    let messageIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typedElement = document.getElementById("dynamicText");

    function typeMessage() {
      const currentMessage = messages[messageIndex];

      if (isDeleting) {
        typedElement.textContent = currentMessage.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typedElement.textContent = currentMessage.substring(0, charIndex + 1);
        charIndex++;
      }

      if (!isDeleting && charIndex === currentMessage.length) {
        setTimeout(() => {
          isDeleting = true;
        }, 2000);
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        messageIndex = (messageIndex + 1) % messages.length;
      }

      let speed = isDeleting ? 50 : 100;
      setTimeout(typeMessage, speed);
    }

    setTimeout(typeMessage, 1000);
  </script>

  <script src="http://localhost:5500/livereload.js"></script>
</body>
</html>
